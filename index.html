<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beskarundan</title>
    
    <!-- iOS inställningar för hemskärmen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Beskarundan">
    <meta name="theme-color" content="#f0fdf4">
    
    <!-- Android/Chrome PWA inställningar för att tvinga bort adressraden (standalone) -->
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href='data:application/manifest+json,%7B%22name%22%3A%22Beskarundan%22%2C%22short_name%22%3A%22Beskarundan%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23f0fdf4%22%2C%22theme_color%22%3A%22%23f0fdf4%22%7D'>
    
    <!-- Snapsglas-ikon för appen -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%2322c55e' rx='24'/%3E%3Cg transform='translate(24, 24) scale(3)' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 13c-1-3 1-6 3-9'/%3E%3Cpath d='M13 7c2-1 3-3 3-3s-1 2-2 3z' fill='white'/%3E%3Cpath d='M11.5 9.5c-2-1-4-1-4-1s2 1 3 2z' fill='white'/%3E%3Cpath d='M14 10c1.5.5 3 2 3 2s-1.5-1-2.5-1.5z' fill='white'/%3E%3Cpath d='M7 3h10l-2 10a2 2 0 0 1-2 1.5h-2a2 2 0 0 1-2-1.5L7 3z'/%3E%3Cpath d='M12 14.5v6.5'/%3E%3Cpath d='M9 21h6'/%3E%3Cpath d='M8 8h8'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%2322c55e' rx='24'/%3E%3Cg transform='translate(24, 24) scale(3)' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 13c-1-3 1-6 3-9'/%3E%3Cpath d='M13 7c2-1 3-3 3-3s-1 2-2 3z' fill='white'/%3E%3Cpath d='M11.5 9.5c-2-1-4-1-4-1s2 1 3 2z' fill='white'/%3E%3Cpath d='M14 10c1.5.5 3 2 3 2s-1.5-1-2.5-1.5z' fill='white'/%3E%3Cpath d='M7 3h10l-2 10a2 2 0 0 1-2 1.5h-2a2 2 0 0 1-2-1.5L7 3z'/%3E%3Cpath d='M12 14.5v6.5'/%3E%3Cpath d='M9 21h6'/%3E%3Cpath d='M8 8h8'/%3E%3C/g%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Dölj pilar i nummer-inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-brand-50 min-h-screen text-slate-800 font-sans pb-12">

    <div class="max-w-md mx-auto pt-8 px-4">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-100 rounded-full mb-4 shadow-sm">
                <!-- Egenritad SVG: Snapsglas med malört -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-brand-600">
                    <!-- Malört (kvist och blad) -->
                    <path d="M12 13c-1-3 1-6 3-9"/>
                    <path d="M13 7c2-1 3-3 3-3s-1 2-2 3z" fill="currentColor"/>
                    <path d="M11.5 9.5c-2-1-4-1-4-1s2 1 3 2z" fill="currentColor"/>
                    <path d="M14 10c1.5.5 3 2 3 2s-1.5-1-2.5-1.5z" fill="currentColor"/>
                    <!-- Snapsglas (spetsglas) -->
                    <path d="M7 3h10l-2 10a2 2 0 0 1-2 1.5h-2a2 2 0 0 1-2-1.5L7 3z"/>
                    <!-- Stam och fot -->
                    <path d="M12 14.5v6.5"/>
                    <path d="M9 21h6"/>
                    <!-- Vätskenivå -->
                    <path d="M8 8h8"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-brand-900 tracking-tight">Beskarundan</h1>
            <p class="text-slate-500 mt-2">Betygsätt kvällens droppar</p>
        </div>

        <!-- Rolig Fakta -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-8 flex items-start gap-3 shadow-sm transition-all hover:shadow-md">
            <div class="bg-amber-100 p-2 rounded-lg text-amber-600 mt-0.5">
                <i class="fa-solid fa-lightbulb text-lg"></i>
            </div>
            <div>
                <h3 class="font-bold text-amber-900 text-sm mb-0.5">Visste du att...</h3>
                <p id="funFactText" class="text-amber-800 text-sm italic leading-relaxed">Laddar snapsfakta...</p>
            </div>
        </div>

        <!-- Inmatningsformulär -->
        <div class="bg-white rounded-2xl shadow-xl border border-brand-100 p-6 mb-8">
            <form id="beskForm" class="space-y-5">
                
                <div class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Hushåll</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-house text-slate-400"></i>
                            </div>
                            <input type="text" id="name" required placeholder="T.ex. Familjen Svensson" 
                                class="pl-10 w-full rounded-xl border-slate-200 bg-slate-50 border p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none">
                        </div>
                    </div>

                    <div>
                        <label for="bottle" class="block text-sm font-semibold text-slate-700 mb-1">Flasknummer</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-wine-bottle text-slate-400"></i>
                            </div>
                            <input type="text" id="bottle" required placeholder="T.ex. 1" 
                                class="pl-10 w-full rounded-xl border-slate-200 bg-slate-50 border p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none">
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <h3 class="text-sm font-semibold text-slate-700 mb-3 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-brand-500 mr-1.5">
                            <!-- Malört -->
                            <path d="M12 13c-1-3 1-6 3-9"/>
                            <path d="M13 7c2-1 3-3 3-3s-1 2-2 3z" fill="currentColor"/>
                            <path d="M11.5 9.5c-2-1-4-1-4-1s2 1 3 2z" fill="currentColor"/>
                            <path d="M14 10c1.5.5 3 2 3 2s-1.5-1-2.5-1.5z" fill="currentColor"/>
                            <!-- Snapsglas -->
                            <path d="M7 3h10l-2 10a2 2 0 0 1-2 1.5h-2a2 2 0 0 1-2-1.5L7 3z"/>
                            <!-- Stam och fot -->
                            <path d="M12 14.5v6.5"/>
                            <path d="M9 21h6"/>
                            <!-- Vätskenivå -->
                            <path d="M8 8h8"/>
                        </svg>
                        Betyg (1-5)
                    </h3>
                    <div class="grid grid-cols-3 gap-3">
                        <!-- Färg -->
                        <div>
                            <label for="color" class="block text-xs text-center text-slate-500 mb-1">Färg</label>
                            <select id="color" required class="w-full rounded-xl border-slate-200 bg-slate-50 border p-3 text-center text-lg font-semibold focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none cursor-pointer">
                                <option value="" disabled selected>-</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <!-- Smak -->
                        <div>
                            <label for="taste" class="block text-xs text-center text-slate-500 mb-1">Smak</label>
                            <select id="taste" required class="w-full rounded-xl border-slate-200 bg-slate-50 border p-3 text-center text-lg font-semibold focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none cursor-pointer">
                                <option value="" disabled selected>-</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <!-- Doft -->
                        <div>
                            <label for="smell" class="block text-xs text-center text-slate-500 mb-1">Doft</label>
                            <select id="smell" required class="w-full rounded-xl border-slate-200 bg-slate-50 border p-3 text-center text-lg font-semibold focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none cursor-pointer">
                                <option value="" disabled selected>-</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label for="comment" class="block text-sm font-semibold text-slate-700 mb-1">Noteringar</label>
                        <div class="relative">
                            <div class="absolute top-3 left-0 pl-3 flex items-start pointer-events-none">
                                <i class="fa-regular fa-comment text-slate-400"></i>
                            </div>
                            <textarea id="comment" rows="2" placeholder="T.ex. 'Väldigt blommig doft...'" 
                                class="pl-10 w-full rounded-xl border-slate-200 bg-slate-50 border p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 mt-2">
                    <button type="submit" id="submitBtn"
                        class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand-500/30 transition-all active:scale-95 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-plus" id="submitIcon"></i> <span id="submitText">Lägg till omdöme</span>
                    </button>
                    <button type="button" id="cancelBtn" onclick="cancelEdit()"
                        class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3.5 px-4 rounded-xl transition-all active:scale-95 flex justify-center items-center px-6">
                        Avbryt
                    </button>
                </div>
            </form>
        </div>

        <!-- Resultatlista -->
        <div>
            <div class="flex justify-between items-end mb-4 px-1">
                <h2 class="text-xl font-bold text-slate-800">Topplista</h2>
                <span id="resultCount" class="text-sm text-slate-500 font-medium">0 omdömen</span>
            </div>
            
            <div id="results" class="space-y-4">
                <!-- Resultatkort renderas här via JS -->
                <div id="emptyState" class="text-center py-10 px-4 bg-white/50 rounded-2xl border border-dashed border-slate-300">
                    <i class="fa-solid fa-clipboard-list text-4xl text-slate-300 mb-3"></i>
                    <p class="text-slate-500">Inga omdömen har lagts till än.<br>Börja provningen ovan!</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Array för att spara alla omdömen (sparas i minnet så länge sidan är öppen)
        let ratings = [];
        let editingId = null; // Håller koll på om vi redigerar ett befintligt inlägg

        // Roliga fakta om besk och snaps
        const funFacts = [
            "Malört, som ger besken sin smak, användes förr i tiden för att hålla mal borta från kläder!",
            "Kryddat brännvin såldes ursprungligen på apotek som medicin mot diverse magåkommor.",
            "Det är det extremt bittra ämnet 'absintin' i malörten som ger den karakteristiska beskan.",
            "Förr trodde man på fullaste allvar att en hutt besk på morgonen kunde bota allt från magont till sjösjuka!",
            "Traditionen att dricka kryddad snaps till maten är faktiskt starkast i Sverige och Danmark.",
            "Bäskadroppar är en riktig skånsk klassiker som har producerats kommersiellt ända sedan slutet av 1800-talet.",
            "Malört skördas traditionellt i slutet av augusti, precis när de små gula blommorna har slagit ut.",
            "Namnet 'akvavit' kommer från latinets 'aqua vitae', som vackert nog betyder 'livets vatten'.",
            "Ordet 'Vermouth' kommer faktiskt från tyskans 'Wermut', som är just ordet för malört!",
            "Jeppson's Malört är en ökänd besk som säljs i Chicago. Den skapades av en svensk immigrant och dricks ofta som ett 'mandomsprov' där borta.",
            "Malörtens latinska namn är 'Artemisia absinthium', döpt efter den grekiska jaktgudinnan Artemis.",
            "Ämnet absintin är ett av de bittraste ämnen vi känner till. Människan kan känna smaken även om det späds ut 70 000 gånger!",
            "Enligt gammal skånsk tradition ska malörten plockas exakt på Bartolomeinatten den 24 augusti för att få allra bäst smak.",
            "I Skåne stavas det oftast 'bäsk', och drycken är ett historiskt måste till riktigt feta rätter som ålagille eller gåsamiddag.",
            "För att inte få en helt odrickbar snaps brukar man rekommendera att malörtskvisten bara får dra i spriten i 1 till 3 dagar.",
            "På engelska heter malört 'Wormwood', vilket kommer av att växten förr användes som medicin för att driva ut inälvsmaskar.",
            "I Uppenbarelseboken i Bibeln faller en stjärna vid namn 'Malört' ner på jorden och gör en tredjedel av allt vatten bittert.",
            "Carl von Linné var ett stort fan av malört och rekommenderade den varmt mot både trötthet och dålig matsmältning.",
            "Malört innehåller ämnet tujon, vilket är samma ämne som (i överdrivna mängder) påstods ge hallucinationer av Absint under 1800-talet.",
            "Under 1800-talet kryddades mycket svenskt brännvin med malört helt enkelt för att dölja den fula finkelsmaken från dåligt hembränt.",
            "I gammal folktro hängde man torkad malört över ytterdörren för att skydda hemmet mot onda andar och häxor.",
            "Förr i tiden lade man ibland malört i bläcket när man skrev viktiga böcker. Beskan hindrade möss och insekter från att äta upp sidorna!"
        ];

        // Välj och visa en slumpmässig fakta när sidan laddas
        document.addEventListener('DOMContentLoaded', () => {
            const randomFact = funFacts[Math.floor(Math.random() * funFacts.length)];
            document.getElementById('funFactText').textContent = `"${randomFact}"`;
        });

        document.getElementById('beskForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Hämta värden
            const nameInput = document.getElementById('name');
            const bottleInput = document.getElementById('bottle');
            const colorInput = document.getElementById('color');
            const tasteInput = document.getElementById('taste');
            const smellInput = document.getElementById('smell');
            const commentInput = document.getElementById('comment');

            const name = nameInput.value.trim();
            const bottle = bottleInput.value.trim();
            const color = parseInt(colorInput.value);
            const taste = parseInt(tasteInput.value);
            const smell = parseInt(smellInput.value);
            const comment = commentInput.value.trim();

            // Validering 1-5
            if(color < 1 || color > 5 || taste < 1 || taste > 5 || smell < 1 || smell > 5) {
                alert("Betygen måste vara mellan 1 och 5!");
                return;
            }

            // Beräkna snitt
            const average = ((color + taste + smell) / 3).toFixed(1);

            if (editingId) {
                // Uppdatera befintligt omdöme
                const index = ratings.findIndex(r => r.id === editingId);
                if (index !== -1) {
                    ratings[index] = { ...ratings[index], name, bottle, color, taste, smell, average, comment };
                }
                cancelEdit(); // Rensa formuläret och återställ knappar
            } else {
                // Skapa objekt och lägg till i listan
                const newRating = {
                    id: Date.now(),
                    name,
                    bottle,
                    color,
                    taste,
                    smell,
                    average,
                    comment
                };
                
                ratings.push(newRating);

                // Rensa formulär (behåll namnet för smidighet om samma person bedömer flera)
                bottleInput.value = '';
                colorInput.value = '';
                tasteInput.value = '';
                smellInput.value = '';
                commentInput.value = '';
                bottleInput.focus();
            }

            // Sortera listan efter snittbetyg (högst först)
            ratings.sort((a, b) => parseFloat(b.average) - parseFloat(a.average));

            // Uppdatera UI
            renderResults();
        });

        function editRating(id) {
            const rating = ratings.find(r => r.id === id);
            if (!rating) return;

            editingId = id;
            
            // Fyll i formuläret med befintliga värden
            document.getElementById('name').value = rating.name;
            document.getElementById('bottle').value = rating.bottle;
            document.getElementById('color').value = rating.color;
            document.getElementById('taste').value = rating.taste;
            document.getElementById('smell').value = rating.smell;
            document.getElementById('comment').value = rating.comment || '';

            // Uppdatera knappens utseende för redigeringsläge
            document.getElementById('submitText').textContent = 'Spara ändring';
            document.getElementById('submitIcon').className = 'fa-solid fa-check';
            document.getElementById('submitBtn').classList.replace('bg-brand-600', 'bg-amber-500');
            document.getElementById('submitBtn').classList.replace('hover:bg-brand-500', 'hover:bg-amber-400');
            document.getElementById('submitBtn').classList.replace('shadow-brand-500/30', 'shadow-amber-500/30');
            document.getElementById('cancelBtn').classList.remove('hidden');

            // Scrolla mjukt upp till toppen
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('beskForm').reset();
            
            // Återställ knappens utseende
            document.getElementById('submitText').textContent = 'Lägg till omdöme';
            document.getElementById('submitIcon').className = 'fa-solid fa-plus';
            document.getElementById('submitBtn').classList.replace('bg-amber-500', 'bg-brand-600');
            document.getElementById('submitBtn').classList.replace('hover:bg-amber-400', 'hover:bg-brand-500');
            document.getElementById('submitBtn').classList.replace('shadow-amber-500/30', 'shadow-brand-500/30');
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function renderResults() {
            const resultsContainer = document.getElementById('results');
            const countLabel = document.getElementById('resultCount');
            
            // Uppdatera räknaren
            countLabel.textContent = `${ratings.length} omdöme${ratings.length !== 1 ? 'n' : ''}`;

            // Om tomt
            if (ratings.length === 0) {
                resultsContainer.innerHTML = `
                    <div id="emptyState" class="text-center py-10 px-4 bg-white/50 rounded-2xl border border-dashed border-slate-300">
                        <i class="fa-solid fa-clipboard-list text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500">Inga omdömen har lagts till än.<br>Börja provningen ovan!</p>
                    </div>
                `;
                return;
            }

            // Rensa och rendera
            resultsContainer.innerHTML = '';
            
            ratings.forEach((rating, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-100 p-5 relative overflow-hidden flex flex-col transform transition-all hover:shadow-md';
                
                // Bestäm färg baserat på placering (Guld, Silver, Brons, Standard)
                let badgeColor = 'bg-brand-500';
                if (index === 0) badgeColor = 'bg-yellow-400 text-yellow-900';
                else if (index === 1) badgeColor = 'bg-slate-300 text-slate-800';
                else if (index === 2) badgeColor = 'bg-amber-600 text-white';

                // Dekorativ vänsterkant och ranknings-badge
                card.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 ${badgeColor.split(' ')[0]}"></div>
                    <div class="absolute top-0 right-0 ${badgeColor} font-black px-3 py-1 rounded-bl-xl text-sm shadow-sm z-10">
                        #${index + 1}
                    </div>
                    
                    <div class="flex justify-between items-start mb-3 pl-2 pr-8">
                        <div>
                            <h3 class="font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-house text-brand-500 text-sm"></i> ${rating.name}
                                <button onclick="editRating(${rating.id})" class="text-slate-300 hover:text-amber-500 transition-colors ml-1" title="Ändra">
                                    <i class="fa-solid fa-pen-to-square text-sm"></i>
                                </button>
                            </h3>
                            <p class="text-sm text-slate-500 mt-0.5">Flasknummer: <span class="font-bold text-slate-700">${rating.bottle}</span></p>
                        </div>
                        <div class="bg-brand-50 text-brand-700 border border-brand-100 px-3 py-1.5 rounded-lg text-center">
                            <span class="block text-xs font-semibold uppercase tracking-wider text-brand-600/80 mb-0.5">Snitt</span>
                            <span class="font-bold text-lg leading-none">${rating.average}</span>
                        </div>
                    </div>

                    <div class="pl-2 mt-2 pt-3 border-t border-slate-50">
                        <div class="flex justify-between text-sm">
                            <div class="text-center">
                                <span class="block text-slate-400 text-xs mb-1">Färg</span>
                                <span class="font-semibold text-slate-700">${rating.color}<span class="text-slate-300 font-normal">/5</span></span>
                            </div>
                            <div class="text-center">
                                <span class="block text-slate-400 text-xs mb-1">Smak</span>
                                <span class="font-semibold text-slate-700">${rating.taste}<span class="text-slate-300 font-normal">/5</span></span>
                            </div>
                            <div class="text-center">
                                <span class="block text-slate-400 text-xs mb-1">Doft</span>
                                <span class="font-semibold text-slate-700">${rating.smell}<span class="text-slate-300 font-normal">/5</span></span>
                            </div>
                        </div>
                    </div>
                    
                    ${rating.comment ? `
                    <div class="pl-2 mt-3 pt-3 border-t border-slate-50">
                        <p class="text-sm text-slate-600 italic bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <i class="fa-solid fa-quote-left text-slate-300 mr-1.5 text-xs"></i>${rating.comment}
                        </p>
                    </div>
                    ` : ''}
                `;
                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
