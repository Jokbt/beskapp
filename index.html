<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beskapp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Betygsätt kvällens beskflaskor och se topplistan.">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beskapp">
<meta name="theme-color" content="#24307F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0C2B" media="(prefers-color-scheme: dark)">

<!-- Android/Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">

<!-- Ikoner: SVG för webbläsarfliken, PNG för hemskärmen (iOS kan inte använda SVG där) -->
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Shrikhand&display=swap" rel="stylesheet">

<style>
  /* Kräftskiva i augustikvällen: lyktgult underlag, vimplar, klistermärkesrunda kort med tjock kontur */
  :root {
    color-scheme: light;
    --paper: #FFEDA6;        /* lyktsken */
    --card: #FFFFFF;
    --ink: #1F1D47;
    --muted: #5B587E;
    --outline: #1F1D47;
    --night: #24307F;        /* kvällshimmel */
    --night-ink: #FFF6D8;
    --red: #EF4A2F;          /* kräfta */
    --red-soft: #FFE1D9;
    --on-red: #FFFFFF;
    --yellow: #FFC21A;       /* lykta och besk */
    --yellow-soft: #FFF7D6;
    --on-yellow: #1F1D47;
    --green: #23A05A;        /* malört */
    --green-soft: #DDF5E5;
    --on-green: #FFFFFF;
    --blue: #3358E0;         /* vimpel */
    --blue-soft: #E1E8FF;
    --on-blue: #FFFFFF;
    --pink: #FF6FAE;
    --pink-soft: #FFE3EF;
    --danger: #C22E16;
    --display: "Shrikhand", "Cooper Black", Georgia, serif;
    --ui: "Fredoka", "Arial Rounded MT Bold", "Nunito", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15133A;
      --card: #25225C;
      --ink: #FFF6DA;
      --muted: #BBB6E2;
      --outline: #07061C;
      --night: #0E0C2B;
      --night-ink: #FFF6DA;
      --red: #FF6A4D;
      --red-soft: #4A2244;
      --on-red: #14122F;
      --yellow: #FFCB3A;
      --yellow-soft: #3D3550;
      --on-yellow: #14122F;
      --green: #3CC476;
      --green-soft: #1D3D4C;
      --on-green: #14122F;
      --blue: #7B94FF;
      --blue-soft: #2C3478;
      --on-blue: #14122F;
      --pink: #FF86BD;
      --pink-soft: #4A2560;
      --danger: #FF8A73;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15133A;
    --card: #25225C;
    --ink: #FFF6DA;
    --muted: #BBB6E2;
    --outline: #07061C;
    --night: #0E0C2B;
    --night-ink: #FFF6DA;
    --red: #FF6A4D;
    --red-soft: #4A2244;
    --on-red: #14122F;
    --yellow: #FFCB3A;
    --yellow-soft: #3D3550;
    --on-yellow: #14122F;
    --green: #3CC476;
    --green-soft: #1D3D4C;
    --on-green: #14122F;
    --blue: #7B94FF;
    --blue-soft: #2C3478;
    --on-blue: #14122F;
    --pink: #FF86BD;
    --pink-soft: #4A2560;
    --danger: #FF8A73;
    color-scheme: dark;
  }

  .tone-yellow { --c: var(--yellow); --c-soft: var(--yellow-soft); --on-c: var(--on-yellow); }
  .tone-green  { --c: var(--green);  --c-soft: var(--green-soft);  --on-c: var(--on-green); }
  .tone-red    { --c: var(--red);    --c-soft: var(--red-soft);    --on-c: var(--on-red); }
  .tone-blue   { --c: var(--blue);   --c-soft: var(--blue-soft);   --on-c: var(--on-blue); }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 17px;
    line-height: 1.4;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  /* ---------- Kvällshimlen med vimplar ---------- */
  .hero {
    position: relative;
    background: var(--night);
    color: var(--night-ink);
    border-radius: 0 0 34px 34px;
    padding-top: env(safe-area-inset-top, 0px);
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, var(--night-ink) 0 1px, transparent 1.6px),
      radial-gradient(circle at 70% 60%, var(--night-ink) 0 1.2px, transparent 1.8px);
    background-size: 46px 38px, 62px 54px;
    opacity: .28;
    pointer-events: none;
  }
  .garland { position: relative; width: 100%; height: 50px; }
  .hero-inner {
    position: relative;
    max-width: 30rem; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding-block: 2px 26px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .mark {
    width: 62px; height: 62px; flex: none;
    border-radius: 50%;
    background: var(--yellow); color: var(--on-yellow);
    border: 3px solid var(--outline);
    box-shadow: 3px 3px 0 var(--outline);
    display: grid; place-items: center;
    transform: rotate(-8deg);
  }
  .mark svg { width: 38px; height: 38px; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 2.7rem;
    line-height: 1.05;
    margin: 0;
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--red);
    transform: rotate(-2deg);
    transform-origin: left center;
  }
  .sub { margin: 6px 0 0; font-weight: 500; font-size: 1rem; opacity: .9; }

  /* ---------- Sidan ---------- */
  .app {
    max-width: 30rem;
    margin: 0 auto;
    padding-block: 18px calc(env(safe-area-inset-bottom, 0px) + 116px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { display: flex; flex-direction: column; gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--card);
    border: 2.5px solid var(--outline);
    border-radius: 24px;
    box-shadow: 4px 4px 0 var(--outline);
    padding: 16px;
  }
  .card-title { display: block; font-weight: 600; font-size: 1.12rem; margin: 0 0 10px; }

  /* Val av betygssystem */
  .modes { display: flex; gap: 6px; padding: 6px; border-radius: 26px; }
  .mode {
    position: relative;
    flex: 1; min-width: 0;
    border: 0; border-radius: 19px;
    background: transparent; color: var(--ink);
    padding: 8px 6px 9px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    text-align: center;
  }
  .mode b { font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
  .mode small { font-size: .8rem; font-weight: 500; color: var(--muted); line-height: 1.2; text-wrap: balance; }
  .mode[aria-checked="true"] { background: var(--ink); color: var(--card); }
  .mode[aria-checked="true"] small { color: inherit; opacity: .8; }
  .mcount {
    position: absolute; top: -9px; right: -2px;
    min-width: 1.6em; padding: 0 6px;
    border-radius: 999px;
    background: var(--yellow); color: var(--on-yellow);
    border: 2px solid var(--outline);
    font-size: .74rem; font-weight: 700; line-height: 1.4;
  }

  /* Snapsfakta */
  .fact { background: var(--pink-soft); }
  .fact-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .fact-head strong { font-weight: 700; font-size: 1.02rem; }
  .fact p { margin: 0; font-size: 1.04rem; line-height: 1.4; }
  .pill-btn {
    border: 2px solid var(--outline);
    background: var(--card);
    border-radius: 999px;
    padding: 4px 14px; min-height: 38px;
    font-weight: 600; font-size: .95rem;
    cursor: pointer;
  }
  .pill-btn:active { transform: translate(1px, 1px); }

  /* Fält */
  input[type="text"], textarea {
    width: 100%;
    font: inherit; font-size: 1.08rem; font-weight: 500;
    color: var(--ink);
    background: var(--paper);
    border: 2.5px solid var(--outline);
    border-radius: 16px;
    padding: 11px 14px;
    outline: none;
  }
  textarea { resize: vertical; min-height: 76px; font-weight: 400; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .85; }
  input[type="text"]:focus, textarea:focus { box-shadow: 0 0 0 4px var(--blue-soft); border-color: var(--blue); }
  .field.invalid input { border-color: var(--danger); box-shadow: 0 0 0 4px var(--red-soft); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chips:empty { display: none; }
  .chip {
    border: 2px solid var(--outline);
    background: var(--card);
    border-radius: 999px;
    padding: 5px 15px; min-height: 42px;
    font-weight: 600; font-size: 1rem;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform .12s;
  }
  .chip:active { transform: scale(.95); }
  .chip[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); box-shadow: 2px 2px 0 var(--outline); }
  .chip.done:not([aria-pressed="true"]) { border-style: dashed; color: var(--muted); background: transparent; }
  .hint { margin: 10px 0 0; font-size: .92rem; color: var(--muted); }

  /* Betyg: färgade kort med runda bubblor */
  .crit { margin: 0; min-width: 0; background: var(--c-soft); }
  .crit legend { float: left; width: 100%; padding: 0; margin: 0 0 12px; }
  .crit-head { display: flex; align-items: center; gap: 10px; }
  .crit-icon {
    width: 38px; height: 38px; flex: none;
    border-radius: 50%;
    background: var(--c); color: var(--on-c);
    border: 2.5px solid var(--outline);
    display: grid; place-items: center;
  }
  .crit-icon svg { width: 20px; height: 20px; }
  .crit-name { font-weight: 700; font-size: 1.2rem; flex: 1; }
  .crit-word {
    font-weight: 600; font-size: .95rem;
    background: var(--card);
    border: 2px solid var(--outline);
    border-radius: 999px;
    padding: 2px 12px;
    white-space: nowrap;
  }
  .crit-word.unset { border-style: dashed; color: var(--muted); background: transparent; }
  .crit.invalid { border-color: var(--danger); box-shadow: 4px 4px 0 var(--danger); }
  .crit.invalid .crit-word { color: var(--danger); border-color: var(--danger); }

  .scale { clear: both; display: flex; justify-content: space-between; gap: 8px; }
  .scale.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center; }
  .b {
    position: relative;
    flex: 1; width: 100%; max-width: 60px; aspect-ratio: 1;
    border-radius: 50%;
    border: 2.5px solid var(--outline);
    background: var(--card);
    display: grid; place-items: center;
    font-weight: 700; font-size: 1.3rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .b input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; border-radius: 50%; }
  .b > span { pointer-events: none; display: grid; justify-items: center; line-height: 1.05; }
  .b small { font-size: .62rem; font-weight: 600; max-width: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b.on { background: var(--c); color: var(--on-c); }
  .b.sel { box-shadow: 3px 3px 0 var(--outline); }
  .b.pop { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
  .b.used { border-style: dashed; background: transparent; color: var(--muted); cursor: not-allowed; }
  .b.used input { cursor: not-allowed; }
  .b:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: 3px; }
  @keyframes pop {
    0% { transform: scale(.85); }
    55% { transform: scale(1.18) rotate(-8deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* Antal hushåll i rankningen */
  .hh { clear: both; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .hh label { font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .step {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2.5px solid var(--outline);
    background: var(--card);
    font-size: 1.5rem; font-weight: 700; line-height: 1;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .step:active { transform: scale(.92); }
  .stepper input[type="text"] { width: 4rem; text-align: center; padding: 8px 6px; font-weight: 700; font-size: 1.2rem; }
  .crit .hint { margin: 6px 0 14px; }

  .editing {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--blue-soft);
    padding: 10px 10px 10px 16px;
    font-weight: 500;
  }
  .error {
    margin: 0;
    background: var(--red-soft); color: var(--danger);
    border: 2px solid var(--danger);
    border-radius: 16px;
    padding: 10px 14px;
    font-weight: 600;
  }

  /* Knappar */
  .btn {
    border: 2.5px solid var(--outline);
    border-radius: 999px;
    box-shadow: 4px 4px 0 var(--outline);
    padding: 12px 20px; min-height: 56px;
    font-weight: 700; font-size: 1.12rem;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--outline); }
  .btn-go { background: var(--red); color: var(--on-red); }
  .btn-blue { background: var(--blue); color: var(--on-blue); }
  .btn-plain { background: var(--card); color: var(--ink); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-outline-danger { background: var(--card); color: var(--danger); }
  .row { display: flex; gap: 12px; }
  .row .btn { flex: 1; }
  .live {
    background: var(--yellow); color: var(--on-yellow);
    border: 2px solid var(--outline);
    border-radius: 999px;
    padding: 0 10px;
    font-family: var(--display); font-weight: 400; font-size: 1.05rem;
    line-height: 1.6;
  }

  /* ---------- Topplistan ---------- */
  .board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h2 {
    font-family: var(--display); font-weight: 400;
    font-size: 2.3rem; line-height: 1.1;
    margin: 0;
    color: var(--red);
    text-shadow: 2px 2px 0 var(--outline);
  }
  .meta { color: var(--muted); font-weight: 500; }

  .podium {
    display: grid; gap: 10px; align-items: end;
    width: 100%; max-width: 24rem; margin: 4px auto 0;
    padding-inline: 4px;
    border-bottom: 3px solid var(--outline);
  }
  .pod {
    background: none; border: 0; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 0; cursor: pointer;
  }
  .crown { width: 38px; height: 26px; margin-bottom: -2px; transform: rotate(-6deg); }
  .pod-name { font-weight: 600; font-size: 1rem; line-height: 1.15; text-align: center; overflow-wrap: anywhere; max-width: 100%; }
  .pod-score { font-family: var(--display); font-size: 1.7rem; line-height: 1; }
  .pod-block {
    width: 100%;
    border: 2.5px solid var(--outline); border-bottom: 0;
    border-radius: 18px 18px 0 0;
    display: grid; justify-items: center; align-content: start;
    padding-top: 6px;
    font-family: var(--display); font-size: 2.3rem; line-height: 1.2;
    margin-top: 4px;
  }
  .p1 .pod-block { height: 124px; background: var(--yellow); color: var(--on-yellow); }
  .p2 .pod-block { height: 92px; background: var(--blue); color: var(--on-blue); }
  .p3 .pod-block { height: 68px; background: var(--red); color: var(--on-red); }

  .list-title { font-weight: 700; font-size: 1.15rem; margin: 6px 2px -4px; }
  .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .entry { padding: 0; overflow: hidden; scroll-margin-top: 16px; }
  .sum {
    width: 100%;
    background: none; border: 0; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: 46px 1fr auto 20px; gap: 12px; align-items: center;
    padding: 12px 14px 12px 12px;
  }
  .rank-badge {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2.5px solid var(--outline);
    background: var(--paper);
    display: grid; place-items: center;
    font-family: var(--display); font-size: 1.35rem; line-height: 1;
  }
  .r1 .rank-badge { background: var(--yellow); color: var(--on-yellow); }
  .r2 .rank-badge { background: var(--blue); color: var(--on-blue); }
  .r3 .rank-badge { background: var(--red); color: var(--on-red); }
  .bmain { min-width: 0; }
  .bname { display: block; font-weight: 600; font-size: 1.18rem; line-height: 1.2; overflow-wrap: anywhere; }
  .bstats { display: block; color: var(--muted); font-size: .92rem; }
  .score { text-align: right; line-height: 1; }
  .score b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.8rem; }
  .score span { font-size: .8rem; color: var(--muted); font-weight: 500; }
  .chev { width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
  .sum[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .details { border-top: 2.5px dashed var(--outline); padding: 14px 14px 6px; }
  .bars { display: grid; grid-template-columns: auto 1fr 2.4rem; gap: 8px 10px; align-items: center; margin-bottom: 10px; font-weight: 500; }
  .bar { height: 14px; border-radius: 999px; background: var(--c-soft); border: 2px solid var(--outline); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); border-right: 2px solid var(--outline); }
  .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ratings { list-style: none; margin: 0; padding: 0; }
  .rating { display: flex; gap: 2px; align-items: flex-start; padding: 12px 0; }
  .rating + .rating { border-top: 2px dotted var(--muted); }
  .r-main { flex: 1; min-width: 0; padding-top: 2px; }
  .r-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .r-name { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
  .r-val { font-family: var(--display); font-size: 1.1rem; }
  .r-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .mini {
    background: var(--c-soft);
    border: 1.5px solid var(--outline);
    border-radius: 999px;
    padding: 0 10px;
    font-size: .88rem; font-weight: 600;
  }
  .r-comment { margin: 6px 0 0; color: var(--muted); overflow-wrap: anywhere; }
  .icon-btn {
    width: 44px; height: 44px; flex: none;
    border: 2px solid transparent; border-radius: 50%;
    background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 21px; height: 21px; }
  .icon-btn:hover { border-color: var(--outline); color: var(--ink); background: var(--card); }
  .icon-btn.del:hover { color: var(--danger); }

  .empty { text-align: center; padding: 28px 20px 22px; }
  .empty .mark { margin: 0 auto 14px; }
  .empty p { margin: 0 0 18px; font-size: 1.05rem; }

  /* ---------- Flikrad ---------- */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding-block: 0 calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .tabs-inner {
    pointer-events: auto;
    max-width: 24rem; margin: 0 auto;
    display: flex; gap: 6px; padding: 6px;
    background: var(--card);
    border: 2.5px solid var(--outline);
    border-radius: 999px;
    box-shadow: 4px 4px 0 var(--outline);
  }
  .tab {
    flex: 1;
    border: 0; border-radius: 999px;
    background: transparent; color: var(--ink);
    min-height: 50px; padding: 4px 10px;
    font-weight: 600; font-size: 1.02rem;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
  }
  .tab svg { width: 22px; height: 22px; flex: none; }

  dialog textarea { margin-bottom: 16px; font-size: .95rem; min-height: 170px; }

  /* ---------- Installera som app ---------- */
  .install { display: flex; gap: 14px; align-items: flex-start; background: var(--blue-soft); }

    width: 60px; height: 60px; flex: none;

  .btn-small:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
  .install-link {

  .steps li { display: flex; gap: 12px; align-items: flex-start; counter-increment: step; line-height: 1.4; }
  .steps li::before {

<script>
(() => {
  'use strict';

  /* ---------- Inställningar ---------- */
  const STORE_KEY = 'beskapp.v2';
  const ICONS = {
    drop: '<path d="M12 3.5s6 6.3 6 10.5a6 6 0 0 1-12 0c0-4.2 6-10.5 6-10.5z"/>',
    waves: '<path d="M4 8c2.2-2 3.8 2 6 0s3.8 2 6 0 3.8 2 4 0M4 13c2.2-2 3.8 2 6 0s3.8 2 6 0 3.8 2 4 0M4 18c2.2-2 3.8 2 6 0s3.8 2 6 0 3.8 2 4 0"/>',
    glass: '<path d="M7 3h10l-2 10a2 2 0 0 1-2 1.5h-2a2 2 0 0 1-2-1.5L7 3zM12 14.5v6.5M9 21h6"/>',
    star: '<path d="M12 3.5l2.6 5.3 5.8.9-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/>',
    trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5c0 2 1.3 3.6 3 3.9M16 6h3c0 2-1.3 3.6-3 3.9M12 13v3M9.5 16h5l.5 4H9z"/>'
  };
  const FSD = [
    { key: 'color', label: 'Färg', tone: 'yellow', icon: 'drop' },
    { key: 'smell', label: 'Doft', tone: 'green', icon: 'waves' },
    { key: 'taste', label: 'Smak', tone: 'red', icon: 'glass' }
  ];
  const MODES = {
    simple:     { name: 'Klassisk', sub: 'Helhet 1–5', long: 'helhetsbetyg 1–5', crits: [{ key: 'score', label: 'Helhetsbetyg', tone: 'blue', icon: 'star' }] },
    categories: { name: 'FSD',      sub: '3 kategorier', long: 'färg, doft och smak 1–5', crits: FSD },
    ranking:    { name: 'Rankning', sub: 'Unika poäng', long: 'unika poäng per hushåll', crits: [{ key: 'score', label: 'Poäng', tone: 'yellow', icon: 'trophy' }] }
  };
  const MODE_KEYS = Object.keys(MODES);
  const WORDS = ['', 'Riktigt dålig', 'Underkänd', 'Okej', 'God!', 'Fantastisk!'];
  const MAX_HOUSEHOLDS = 30;

  const FACTS = [
    'Malört användes förr för att hålla mal borta från kläderna. Kanske är det därifrån namnet kommer.',
    'De första kända uppgifterna om brännvin i Sverige är från 1467. Till en början användes spriten till att tillverka krut.',
    'På 1500-talet började man krydda brännvinet, främst av medicinska skäl. Örterna ansågs kunna skydda mot sjukdomar, till och med pesten.',
    'Det är det bittra ämnet absintin i malörten som ger besken dess karaktär.',
    'Absintin smakar bittert redan i extremt låga halter. Ett enda gram skulle i teorin räcka för att göra över 15 000 liter vatten märkbart bittert.',
    'Förr trodde man på fullaste allvar att en hutt besk på morgonen kunde bota allt från magont till sjösjuka.',
    'Snapsvisor sjungs inte bara i Sverige. De hör till festerna även i Norge, Danmark och bland finlandssvenskar.',
    'Besk dricks framför allt i södra och sydvästra Sverige. Förr bjöd man alltid gästerna på en besk när de kom på besök.',
    'Bäska Droppar, landets mest kända besk, tillverkas i dag i Sundsvall, långt från beskens kärnland i söder.',
    'Namnet akvavit kommer från latinets aqua vitae, som betyder livets vatten.',
    'Ordet vermouth kommer från tyskans Wermut, som betyder just malört.',
    'Carl Jeppson, en svensk invandrare i Chicago, sålde sin malört dörr till dörr som medicin på 1920-talet, under förbudstiden. I dag dricks Jeppson’s Malört ofta som ett mandomsprov.',
    'Malörtens latinska namn är Artemisia absinthium. Släktnamnet brukar härledas till gudinnan Artemis, eller till drottning Artemisia av Karien.',
    'Många plockar malörten kring Bartolomeus den 24 augusti, när de små gula blommorna har slagit ut.',
    'Bäsk är en äldre stavning av besk, ett ord som helt enkelt betyder bitter.',
    'Besk hör traditionellt ihop med fet mat. På ett skånskt ålagille är den nästan ett måste.',
    'Låt inte malörten dra för länge. Många recept säger bara några dagar, annars blir snapsen odrickbart besk.',
    'Engelskans wormwood kommer från fornengelskans wermod. Ordet worm smög sig in först senare, eftersom växten användes mot inälvsmask.',
    'I England drack man förr purl, eller wormwood ale: öl som fått dra med malörtstoppar.',
    'I Uppenbarelseboken faller en stjärna som heter Malört ner på jorden och gör en tredjedel av vattnet bittert.',
    'Linné försvarade den bittra smaken i Urban Hjärnes berömda droppar med att de annars inte vore någon medicin.',
    'Malört innehåller tujon, samma ämne som på 1800-talet påstods ge absintdrickare hallucinationer.',
    'Kryddor och lite socker hjälpte förr till att dölja felsmakerna i dåtidens brännvin.',
    'Enligt gammal folktro skyddade torkad malört över dörren hemmet mot onda andar.',
    'Förr blandade man ibland malört i bläcket, så att möss inte skulle äta upp de skrivna sidorna.',
    'Svenskar har dragit malört på brännvin sedan 1400-talet, och besken klarade sig genom nykterhetsrörelsens år delvis tack vare kräftskivorna.'
  ];

  const svg = (inner, cls = '') => `<svg${cls ? ` class="${cls}"` : ''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const ICON_EDIT = svg('<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>');
  const ICON_DEL = svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>');
  const ICON_CHEV = svg('<path d="M6 9l6 6 6-6"/>', 'chev');
  const CROWN = '<svg class="crown" viewBox="0 0 38 26" aria-hidden="true"><path d="M3 23 L4.5 6 L12 13 L19 3 L26 13 L33.5 6 L35 23 Z" fill="var(--yellow)" stroke="var(--outline)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="19" cy="17" r="2.6" fill="var(--red)" stroke="var(--outline)" stroke-width="1.6"/></svg>';

  /* ---------- Hjälpfunktioner ---------- */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tidy = (s) => String(s).trim().replace(/\s+/g, ' ');
  const keyOf = (s) => tidy(s).toLocaleLowerCase('sv');
  const collator = new Intl.Collator('sv', { numeric: true, sensitivity: 'base' });
  const fmt = (n) => n.toLocaleString('sv-SE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const bottleLabel = (b) => /^\d+$/.test(b) ? 'Flaska ' + b : b;          // "3" blir "Flaska 3"
  const bottleInText = (b) => bottleLabel(b).replace(/^Flaska/, 'flaska');  // mitt i en mening
  const bottleShort = (b) => /^\d+$/.test(b) ? 'fl. ' + b : b;
  const genitive = (name) => /[sxz]$/i.test(name) ? name : name + 's';
  const joinSv = (a) => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' och ' + a[a.length - 1];
  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
  const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;

  /* ---------- Tillstånd och lagring ---------- */
  let state = { ratings: [], lastName: '', mode: 'simple', households: 0 };
  let editingId = null;
  let returnToBoard = false;
  const scores = { score: 0, color: 0, smell: 0, taste: 0 };
  const expanded = new Set();
  let storageWarned = false;

  const isRanking = () => state.mode === 'ranking';
  const crits = () => MODES[state.mode].crits;
  const maxFor = () => isRanking() ? state.households : 5;
  const value = (r) => r.mode === 'categories' ? (r.color + r.smell + r.taste) / 3 : r.score;
  const modeRatings = (m = state.mode) => state.ratings.filter((r) => r.mode === m);

  function isValidRating(r) {
    if (!r || typeof r.id !== 'string' || !tidy(r.name || '') || !tidy(r.bottle || '') || !MODES[r.mode]) return false;
    if (r.mode === 'categories') return FSD.every((c) => isInt(r[c.key], 1, 5));
    if (r.mode === 'simple') return isInt(r.score, 1, 5);
    return isInt(r.score, 1, 99);
  }

  // Data från den tidigare versionen av Beskapp (nycklarna beskaRatings, beskaMode, beskaParticipants)
  function migrateOld() {
    try {
      const old = JSON.parse(localStorage.getItem('beskaRatings') || 'null');
      const oldMode = localStorage.getItem('beskaMode');
      const oldCount = parseInt(localStorage.getItem('beskaParticipants'), 10);
      const ratings = (Array.isArray(old) ? old : []).map((o) => {
        const r = {
          id: String(o.id), mode: MODES[o.mode] ? o.mode : 'simple',
          name: tidy(o.name || ''), bottle: tidy(o.bottle || ''), comment: tidy(o.comment || ''),
          at: typeof o.id === 'number' ? o.id : Date.now()
        };
        if (r.mode === 'categories' && o.details) {
          r.color = Number(o.details.color); r.smell = Number(o.details.smell); r.taste = Number(o.details.taste);
        } else {
          r.score = Math.round(Number(o.score));
        }
        return r;
      }).filter(isValidRating);
      return {
        ratings,
        lastName: '',
        mode: MODES[oldMode] ? oldMode : 'simple',
        households: isInt(oldCount, 1, MAX_HOUSEHOLDS) ? oldCount : 0
      };
    } catch (e) { return null; }
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (data && Array.isArray(data.ratings)) {
        state.ratings = data.ratings.filter(isValidRating);
        state.lastName = typeof data.lastName === 'string' ? data.lastName : '';
        state.mode = MODES[data.mode] ? data.mode : 'simple';
        state.households = isInt(data.households, 0, MAX_HOUSEHOLDS) ? data.households : 0;
        return;
      }
    } catch (e) { /* trasig data: prova den gamla versionen */ }
    const old = migrateOld();
    if (old) { state = old; persist(); }
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      if (!storageWarned) {
        storageWarned = true;
        setTimeout(() => toast('Webbläsaren sparar inte. Omdömena försvinner om sidan laddas om.'), 2800);
      }
    }
  }

  /* ---------- Beräkningar ---------- */
  function bottleList(mode = state.mode) {
    const map = new Map();
    for (const r of modeRatings(mode)) {
      const k = keyOf(r.bottle);
      if (!map.has(k)) map.set(k, { key: k, name: r.bottle, ratings: [] });
      map.get(k).ratings.push(r);
    }
    const list = [...map.values()].map((b) => {
      const n = b.ratings.length;
      const sum = b.ratings.reduce((s, r) => s + value(r), 0);
      const total = mode === 'ranking' ? sum : sum / n;      // rankning: poängen summeras
      const m = {};
      if (mode === 'categories') FSD.forEach((c) => { m[c.key] = b.ratings.reduce((s, r) => s + r[c.key], 0) / n; });
      const ratings = [...b.ratings].sort((x, y) => value(y) - value(x) || collator.compare(x.name, y.name));
      return { key: b.key, name: b.name, ratings, n, m, total };
    });
    list.sort((a, b) => b.total - a.total || b.n - a.n || collator.compare(a.name, b.name));
    // Delad placering vid lika resultat (1, 1, 3 …)
    let prev = null, rank = 0;
    list.forEach((b, i) => {
      const t = Math.round(b.total * 1000);
      if (t !== prev) { rank = i + 1; prev = t; }
      b.rank = rank;
    });
    return list;
  }

  const fmtTotal = (v) => isRanking() ? String(Math.round(v)) : fmt(v);
  const totalUnit = () => isRanking() ? 'poäng' : 'av 5';

  // Den flaska som ensam leder, annars null
  function soleLeader() {
    const l = bottleList();
    if (!l.length || (l[1] && l[1].rank === 1)) return null;
    return l[0];
  }

  function participants() {
    const seen = new Map();
    state.ratings.forEach((r) => { const k = keyOf(r.name); if (!seen.has(k)) seen.set(k, r.name); });
    return [...seen.values()];
  }

  // Poäng som hushållet redan delat ut i rankningen, utom för den flaska som betygsätts nu
  function usedPoints(nameK, bottleK) {
    const used = new Map();
    if (!nameK) return used;
    modeRatings('ranking')
      .filter((r) => keyOf(r.name) === nameK && r.id !== editingId && keyOf(r.bottle) !== bottleK)
      .forEach((r) => used.set(r.score, r.bottle));
    return used;
  }

  /* ---------- Konfetti ---------- */
  const confetti = (() => {
    const cv = $('#confetti');
    const ctx = cv.getContext('2d');
    let parts = [], raf = null;
    const colors = () => ['--red', '--yellow', '--green', '--blue', '--pink'].map(cssVar);
    function resize() {
      const d = window.devicePixelRatio || 1;
      cv.width = innerWidth * d; cv.height = innerHeight * d;
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function add(p) { parts.push(p); if (!raf) raf = requestAnimationFrame(tick); }
    function piece(x, y, vx, vy, g, cols) {
      return { x, y, vx, vy, g, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)],
        round: Math.random() < .3, phase: Math.random() * 6, t: 0 };
    }
    function burst(x, y, n = 28) {
      if (reducedMotion()) return;
      if (!raf) resize();
      const cols = colors();
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 6;
        add(piece(x, y, Math.cos(a) * s, Math.sin(a) * s - 4, .32, cols));
      }
    }
    function rain(n = 150) {
      if (reducedMotion()) return;
      if (!raf) resize();
      const cols = colors();
      for (let i = 0; i < n; i++) {
        add(piece(Math.random() * innerWidth, -20 - Math.random() * innerHeight * .5,
          (Math.random() - .5) * 2, 2 + Math.random() * 3, .05, cols));
      }
    }
    function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of parts) {
        p.t++;
        p.vx = p.vx * .985 + Math.sin(p.t * .08 + p.phase) * .12;
        p.vy = Math.min(p.vy + p.g, 6);
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.t * .1 + p.phase)) + 2);
        ctx.restore();
      }
      parts = parts.filter((p) => p.y < innerHeight + 30 && p.t < 600);
      if (parts.length) raf = requestAnimationFrame(tick);
      else { raf = null; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    }
    return { burst, rain };
  })();

  /* ---------- Vimplar ---------- */
  function buildGarland() {
    const tones = ['--red', '--yellow', '--green', '--blue', '--pink'];
    const yAt = (x) => { const t = (x + 10) / 500; return 4 + 60 * t * (1 - t); };
    let out = '<path d="M-10 4 Q240 34 490 4" fill="none" stroke="var(--night-ink)" stroke-opacity=".55" stroke-width="1.5"/>';
    for (let i = 0, x = 12; x < 480; i++, x += 36) {
      const y = yAt(x);
      out += `<path d="M${x - 12} ${y} L${x + 12} ${yAt(x + 12)} L${x} ${y + 26} Z" fill="var(${tones[i % tones.length]})" stroke="var(--outline)" stroke-width="1.5" stroke-linejoin="round"/>`;
    }
    $('#garland').innerHTML = out;
  }

  /* ---------- Betygssystem ---------- */
  function renderModes() {
    $('#modes').innerHTML = MODE_KEYS.map((m) => {
      const n = modeRatings(m).length;
      return `<button type="button" class="mode" role="radio" data-mode="${m}" aria-checked="${m === state.mode}">
        <b>${MODES[m].name}</b><small>${MODES[m].sub}</small>
        ${n && m !== state.mode ? `<span class="mcount" aria-label="${plural(n, 'omdöme', 'omdömen')}">${n}</span>` : ''}
      </button>`;
    }).join('');
  }

  function setMode(m) {
    if (!MODES[m] || m === state.mode) return;
    if (editingId) exitEdit();
    state.mode = m;
    persist();
    Object.keys(scores).forEach((k) => { scores[k] = 0; });
    hideError();
    buildScales();
    renderModes();
    renderAll();
  }

  /* ---------- Betygsbubblorna ---------- */
  function critHead(c, word) {
    return `<legend><span class="crit-head">
      <span class="crit-icon">${svg(ICONS[c.icon])}</span>
      <span class="crit-name">${c.label}</span>
      <span class="crit-word unset" id="val-${c.key}">${word}</span>
    </span></legend>`;
  }

  function buildScales() {
    const host = $('#scales');
    if (isRanking()) {
      const c = crits()[0];
      host.innerHTML = `
        <fieldset class="card crit tone-${c.tone}" data-key="${c.key}">
          ${critHead(c, 'Välj poäng')}
          <div class="hh">
            <label for="households">Antal hushåll</label>
            <div class="stepper">
              <button type="button" class="step" data-step="-1" aria-label="Ett hushåll färre">−</button>
              <input type="text" id="households" inputmode="numeric" maxlength="2" placeholder="?" value="${state.households || ''}">
              <button type="button" class="step" data-step="1" aria-label="Ett hushåll till">+</button>
            </div>
          </div>
          <p class="hint" id="rankHint"></p>
          <div class="scale grid" id="rankScale"></div>
        </fieldset>`;
      renderRankScale();
    } else {
      host.innerHTML = crits().map((c) => `
        <fieldset class="card crit tone-${c.tone}" data-key="${c.key}">
          ${critHead(c, 'Välj 1–5')}
          <div class="scale">
            ${[1, 2, 3, 4, 5].map((v) => `<label class="b"><input type="radio" name="${c.key}" value="${v}" aria-label="${c.label} ${v} av 5"><span aria-hidden="true">${v}</span></label>`).join('')}
          </div>
        </fieldset>`).join('');
      crits().forEach((c) => setScore(c.key, scores[c.key]));
    }
  }

  function renderRankScale() {
    const host = $('#rankScale');
    if (!host) return;
    const n = state.households;
    const nameRaw = tidy($('#name').value);
    const used = usedPoints(keyOf(nameRaw), keyOf($('#bottle').value));
    if (scores.score && (scores.score > n || used.has(scores.score))) scores.score = 0;

    const hint = $('#rankHint');
    if (!n) hint.textContent = 'Ange hur många hushåll som deltar. Varje hushåll delar sedan ut poängen 1 till och med det antalet, en poäng per flaska.';
    else if (!nameRaw) hint.textContent = `Varje hushåll delar ut poängen 1–${n}, en gång var. Fyll i hushåll för att se vilka poäng som är lediga.`;
    else if (used.size) hint.textContent = `${nameRaw} har delat ut ${used.size} av ${n} poäng. Högst poäng till favoriten.`;
    else hint.textContent = `Dela ut poängen 1–${n}, en gång var. Högst poäng till favoriten.`;

    host.innerHTML = Array.from({ length: n }, (_, i) => {
      const v = i + 1, u = used.get(v);
      return `<label class="b${u ? ' used' : ''}"><input type="radio" name="score" value="${v}"` +
        ` aria-label="${v} poäng${u ? ', redan given till ' + esc(bottleInText(u)) : ''}"${u ? ' disabled' : ''}>` +
        `<span aria-hidden="true">${v}${u ? `<small>${esc(bottleShort(u))}</small>` : ''}</span></label>`;
    }).join('');
    setScore('score', scores.score);
  }

  function setHouseholds(n, fromInput) {
    n = Math.max(0, Math.min(MAX_HOUSEHOLDS, Number.isFinite(n) ? Math.trunc(n) : 0));
    state.households = n;
    persist();
    const inp = $('#households');
    if (inp && !fromInput) inp.value = n || '';
    renderRankScale();
  }

  function setScore(key, v, fromTap) {
    scores[key] = v;
    const fs = document.querySelector(`.crit[data-key="${key}"]`);
    if (!fs) return;
    const bubbles = fs.querySelectorAll('.b');
    bubbles.forEach((b, i) => {
      b.classList.toggle('on', isRanking() ? i === v - 1 : i < v);   // rankning: bara den valda poängen
      b.classList.toggle('sel', i === v - 1);
      b.classList.remove('pop');
    });
    fs.querySelectorAll('input').forEach((inp) => { inp.checked = Number(inp.value) === v; });
    if (v) fs.classList.remove('invalid');
    const word = $('#val-' + key);
    if (word) {
      word.textContent = v ? (isRanking() ? plural(v, 'poäng', 'poäng') : WORDS[v]) : (isRanking() ? 'Välj poäng' : 'Välj 1–5');
      word.classList.toggle('unset', !v);
    }

    if (fromTap && v) {
      const b = bubbles[v - 1];
      void b.offsetWidth;            // starta om studs-animationen
      b.classList.add('pop');
      if (v === maxFor()) {
        const r = b.getBoundingClientRect();
        confetti.burst(r.left + r.width / 2, r.top + r.height / 2, 30);
      }
    }
    updateLive();
  }

  function updateLive() {
    const live = $('#liveAvg');
    const show = state.mode === 'categories' && FSD.every((c) => scores[c.key]);
    live.hidden = !show;
    if (show) live.textContent = fmt((scores.color + scores.smell + scores.taste) / 3);
  }

  /* ---------- Formuläret ---------- */
  function resetForm() {
    $('#name').value = state.lastName;
    $('#bottle').value = '';
    $('#comment').value = '';
    Object.keys(scores).forEach((k) => { scores[k] = 0; });
    if (isRanking()) renderRankScale();
    else crits().forEach((c) => setScore(c.key, 0));
    updateLive();
    hideError();
  }

  function showError(msg, fieldsToFlag) {
    const e = $('#error');
    e.textContent = msg;
    e.hidden = false;
    fieldsToFlag.forEach((id) => $('#field-' + id).classList.add('invalid'));
  }
  function hideError() {
    $('#error').hidden = true;
    document.querySelectorAll('.invalid').forEach((el) => el.classList.remove('invalid'));
  }

  function renderChips() {
    const nameK = keyOf($('#name').value);
    const bottleK = keyOf($('#bottle').value);

    const names = participants();
    const showNames = names.length > 1 || (names.length === 1 && keyOf(names[0]) !== nameK);
    $('#nameChips').innerHTML = showNames
      ? names.map((n) => `<button type="button" class="chip" data-name="${esc(n)}" aria-pressed="${keyOf(n) === nameK}">${esc(n)}</button>`).join('')
      : '';

    const done = new Set(modeRatings()
      .filter((r) => nameK && keyOf(r.name) === nameK && r.id !== editingId)
      .map((r) => keyOf(r.bottle)));
    // Flaskor från alla system, så att numren finns kvar även när man byter system
    const seen = new Map();
    state.ratings.forEach((r) => { const k = keyOf(r.bottle); if (!seen.has(k)) seen.set(k, r.bottle); });
    const bottles = [...seen.entries()].sort((a, b) => collator.compare(a[1], b[1]));
    $('#bottleChips').innerHTML = bottles.map(([k, name]) => {
      const isDone = done.has(k);
      return `<button type="button" class="chip${isDone ? ' done' : ''}" data-bottle="${esc(name)}" aria-pressed="${k === bottleK}">` +
        `${esc(name)}${isDone ? '<span aria-hidden="true">✓</span><span class="sr">, redan betygsatt</span>' : ''}</button>`;
    }).join('');
    $('#doneHint').hidden = done.size === 0;
    if (isRanking()) renderRankScale();
  }

  // Samma stavning som redan finns, så att "familjen svensson" och "Familjen Svensson" blir samma hushåll
  function canonical(val, existing) {
    const k = keyOf(val);
    return existing.find((x) => keyOf(x) === k) || tidy(val);
  }

  function collect() {
    const others = state.ratings.filter((r) => r.id !== editingId);
    const d = {
      mode: state.mode,
      name: canonical($('#name').value, others.map((r) => r.name)),
      bottle: canonical($('#bottle').value, others.map((r) => r.bottle)),
      comment: $('#comment').value.trim()
    };
    if (state.mode === 'categories') FSD.forEach((c) => { d[c.key] = scores[c.key]; });
    else d.score = scores.score;
    return d;
  }

  function validate(d) {
    const missing = [], fields = [];
    if (!d.name) { missing.push('hushåll'); fields.push('name'); }
    if (!d.bottle) { missing.push('flaska'); fields.push('bottle'); }
    if (isRanking() && !state.households) missing.push('antal hushåll');
    crits().forEach((c) => {
      if (!d[c.key]) {
        missing.push(isRanking() ? 'poäng' : 'betyg för ' + c.label.toLowerCase());
        document.querySelector(`.crit[data-key="${c.key}"]`).classList.add('invalid');
      }
    });
    if (missing.length) {
      showError('Det saknas ' + joinSv(missing) + '.', fields);
      const first = fields[0] ? $('#field-' + fields[0]) : document.querySelector('.crit.invalid');
      if (first) first.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' });
      if (fields[0]) $('#' + fields[0]).focus({ preventScroll: true });
      return false;
    }
    if (isRanking()) {
      const used = usedPoints(keyOf(d.name), keyOf(d.bottle));
      if (d.score > state.households || used.has(d.score)) {
        const u = used.get(d.score);
        showError(u ? `${d.name} har redan gett ${d.score} poäng till ${bottleInText(u)}. Välj en annan poäng.` :
          `Poängen kan vara högst ${state.households}.`, []);
        document.querySelector('.crit').classList.add('invalid');
        return false;
      }
    }
    return true;
  }

  function onSubmit(e) {
    e.preventDefault();
    hideError();
    const d = collect();
    if (!validate(d)) return;

    const dup = modeRatings().find((r) => r.id !== editingId && keyOf(r.name) === keyOf(d.name) && keyOf(r.bottle) === keyOf(d.bottle));

    if (editingId) {
      if (!dup) { updateRating(editingId, d, 'Ändringen sparad'); return; }
      const id = editingId;
      ask({
        title: 'Två omdömen för samma flaska',
        text: `${d.name} har redan ett annat omdöme för ${bottleInText(dup.bottle)}. Vill du ersätta det med det här?`,
        ok: 'Ersätt',
        onOk: () => {
          state.ratings = state.ratings.filter((r) => r.id !== dup.id);
          updateRating(id, d, 'Ändringen sparad');
        }
      });
      return;
    }

    if (dup) {
      ask({
        title: 'Redan betygsatt',
        text: `${d.name} har redan betygsatt ${bottleInText(dup.bottle)} (${describe(dup)}). Vill du ersätta det omdömet med det nya?`,
        ok: 'Ersätt',
        onOk: () => updateRating(dup.id, d, 'Omdömet ersattes')
      });
      return;
    }
    addRating(d);
  }

  function describe(r) {
    if (r.mode === 'ranking') return plural(r.score, 'poäng', 'poäng');
    if (r.mode === 'categories') return 'snitt ' + fmt(value(r));
    return 'betyg ' + r.score;
  }

  // Firar toppbetyg eller en ny ensam etta efter att något sparats
  function celebrate(d, leaderBefore, fallbackMsg) {
    const leaderAfter = soleLeader();
    const top = d.mode === 'categories' ? FSD.every((c) => d[c.key] === 5)
      : d.mode === 'simple' ? d.score === 5 : d.score === state.households;
    const newLeader = leaderAfter && bottleList().length > 1 && (!leaderBefore || leaderBefore.key !== leaderAfter.key);
    if (top) {
      confetti.rain();
      toast(d.mode === 'ranking' ? `Toppoäng till ${bottleInText(d.bottle)}!` : `Full pott för ${bottleInText(d.bottle)}!`);
    } else if (newLeader) {
      confetti.rain(110);
      toast(`Ny etta: ${bottleLabel(leaderAfter.name)}!`);
    } else {
      toast(fallbackMsg);
    }
  }

  function addRating(d) {
    const before = soleLeader();
    state.ratings.push({ id: uid(), at: Date.now(), ...d });
    state.lastName = d.name;
    persist();
    resetForm();
    renderAll();
    celebrate(d, before, `Omdöme sparat för ${bottleInText(d.bottle)}`);
    $('#field-name').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  function updateRating(id, d, msg) {
    const i = state.ratings.findIndex((r) => r.id === id);
    if (i < 0) return;
    const before = soleLeader();
    const old = state.ratings[i];
    state.ratings[i] = { id: old.id, at: old.at || Date.now(), ...d };
    if (!editingId) state.lastName = d.name;   // Att rätta någon annans omdöme byter inte vem som provar
    persist();
    const goBack = editingId !== null && returnToBoard;
    exitEdit();
    resetForm();
    if (goBack) { expanded.add(keyOf(d.bottle)); showView('board'); }
    renderAll();
    celebrate(d, before, msg);
  }

  function startEdit(id) {
    const r = state.ratings.find((x) => x.id === id);
    if (!r) return;
    if (r.mode !== state.mode) setMode(r.mode);
    editingId = id;
    returnToBoard = !$('#view-board').hidden;
    hideError();
    $('#name').value = r.name;
    $('#bottle').value = r.bottle;
    $('#comment').value = r.comment || '';
    if (r.mode === 'categories') FSD.forEach((c) => setScore(c.key, r[c.key]));
    else { scores.score = r.score; if (isRanking()) renderRankScale(); else setScore('score', r.score); }
    $('#editText').textContent = `Du ändrar ${genitive(r.name)} omdöme av ${bottleInText(r.bottle)}.`;
    $('#editBanner').hidden = false;
    $('#cancelBtn').hidden = false;
    $('#submitText').textContent = 'Spara ändring';
    showView('rate');
    renderChips();
    $('#editBanner').scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  function exitEdit() {
    editingId = null;
    $('#editBanner').hidden = true;
    $('#cancelBtn').hidden = true;
    $('#submitText').textContent = 'Spara omdöme';
  }

  function cancelEdit() {
    const goBack = returnToBoard;
    exitEdit();
    resetForm();
    renderChips();
    if (goBack) showView('board');
  }

  function deleteRating(id) {
    const i = state.ratings.findIndex((r) => r.id === id);
    if (i < 0) return;
    const [removed] = state.ratings.splice(i, 1);
    if (editingId === id) { exitEdit(); resetForm(); }
    persist();
    renderAll();
    toast('Omdöme raderat', {
      label: 'Ångra',
      fn: () => {
        state.ratings.splice(Math.min(i, state.ratings.length), 0, removed);
        persist();
        renderAll();
        toast('Omdömet är tillbaka');
      }
    });
  }

  /* ---------- Topplistan ---------- */
  function renderPodium(list) {
    const top = list.slice(0, 3);
    const order = [[], [0], [1, 0], [1, 0, 2]][top.length];   // tvåan till vänster, ettan i mitten
    const pod = $('#podium');
    pod.hidden = top.length === 0;
    pod.style.gridTemplateColumns = `repeat(${top.length}, minmax(0, 1fr))`;
    pod.style.maxWidth = top.length === 1 ? '10rem' : top.length === 2 ? '17rem' : '';
    pod.innerHTML = order.map((i) => {
      const b = top[i];
      return `<button type="button" class="pod p${i + 1}" data-jump="${esc(b.key)}" aria-label="Plats ${b.rank}: ${esc(bottleLabel(b.name))}, ${fmtTotal(b.total)} ${totalUnit(b.total)}. Visa detaljer.">
        ${i === 0 ? CROWN : ''}
        <span class="pod-name">${esc(bottleLabel(b.name))}</span>
        <span class="pod-score">${fmtTotal(b.total)}</span>
        <span class="pod-block" aria-hidden="true">${b.rank}</span>
      </button>`;
    }).join('');
  }

  function ratingRow(r) {
    let val, pills = '';
    if (r.mode === 'categories') {
      val = fmt(value(r));
      pills = FSD.map((c) => `<span class="mini tone-${c.tone}">${c.label} ${r[c.key]}</span>`).join('');
    } else if (r.mode === 'simple') {
      val = String(r.score);
      pills = `<span class="mini tone-blue">${WORDS[r.score]}</span>`;
    } else {
      val = plural(r.score, 'poäng', 'poäng');
    }
    return `<li class="rating">
      <div class="r-main">
        <div class="r-top"><span class="r-name">${esc(r.name)}</span><span class="r-val">${val}</span></div>
        ${pills ? `<div class="r-pills">${pills}</div>` : ''}
        ${r.comment ? `<p class="r-comment">”${esc(r.comment)}”</p>` : ''}
      </div>
      <button type="button" class="icon-btn" data-edit="${esc(r.id)}" aria-label="Ändra ${esc(genitive(r.name))} omdöme">${ICON_EDIT}</button>
      <button type="button" class="icon-btn del" data-del="${esc(r.id)}" aria-label="Radera ${esc(genitive(r.name))} omdöme">${ICON_DEL}</button>
    </li>`;
  }

  function renderBoard() {
    const list = bottleList();
    const n = modeRatings().length;
    const count = $('#tabCount');
    count.textContent = n;
    count.hidden = n === 0;
    $('#boardMeta').textContent = n ? `${MODES[state.mode].name}: ${plural(list.length, 'flaska', 'flaskor')}, ${plural(n, 'omdöme', 'omdömen')}` : MODES[state.mode].name;
    $('#empty').hidden = n > 0;
    $('#boardActions').hidden = state.ratings.length === 0;
    $('#shareBtn').hidden = n === 0;
    $('#listTitle').hidden = n === 0;

    if (!n) {
      const others = MODE_KEYS.filter((m) => m !== state.mode && modeRatings(m).length)
        .map((m) => `${plural(modeRatings(m).length, 'omdöme', 'omdömen')} i ${MODES[m].name}`);
      $('#emptyText').textContent = `Inga omdömen i ${MODES[state.mode].name} än.` +
        (others.length ? ` Det finns ${joinSv(others)}. Byt system högst upp för att se dem.` : ' När första flaskan är betygsatt hamnar den här.');
    }
    renderPodium(list);

    $('#board').innerHTML = list.map((b, idx) => {
      const open = expanded.has(b.key);
      const medal = b.rank <= 3 ? ` r${b.rank}` : '';
      const bars = state.mode === 'categories' ? `<div class="bars">
          ${FSD.map((c) => `<span>${c.label}</span><span class="bar tone-${c.tone}"><i style="width:${(b.m[c.key] / 5 * 100).toFixed(1)}%"></i></span><span class="num">${fmt(b.m[c.key])}</span>`).join('')}
        </div>` : '';
      return `<li class="card entry${medal}" data-key="${esc(b.key)}">
        <button type="button" class="sum" data-toggle="${esc(b.key)}" aria-expanded="${open}" aria-controls="bottle-${idx}">
          <span class="rank-badge" aria-label="Plats ${b.rank}">${b.rank}</span>
          <span class="bmain"><span class="bname">${esc(bottleLabel(b.name))}</span><span class="bstats">${plural(b.n, 'omdöme', 'omdömen')}</span></span>
          <span class="score"><b>${fmtTotal(b.total)}</b><span>${totalUnit(b.total)}</span></span>
          ${ICON_CHEV}
        </button>
        <div class="details" id="bottle-${idx}"${open ? '' : ' hidden'}>
          ${bars}
          <ul class="ratings">${b.ratings.map(ratingRow).join('')}</ul>
        </div>
      </li>`;
    }).join('');
  }

  function renderAll() {
    renderModes();
    renderChips();
    renderBoard();
  }

  async function shareBoard() {
    const list = bottleList();
    if (!list.length) return;
    const date = new Date().toLocaleDateString('sv-SE', { day: 'numeric', month: 'long', year: 'numeric' });
    const text = [`Beskapp, topplista ${date}`, `Betygssystem: ${MODES[state.mode].name} (${MODES[state.mode].long})`, '']
      .concat(list.map((b) => `${b.rank}. ${bottleLabel(b.name)}: ${fmtTotal(b.total)} ${totalUnit(b.total)} (${plural(b.n, 'omdöme', 'omdömen')})`))
      .join('\n');

    if (navigator.share) {
      try { await navigator.share({ title: 'Beskapp', text }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(text);
      toast('Topplistan kopierad');
    } catch (e) {
      ask({ title: 'Kopiera topplistan', text: 'Markera texten och kopiera den.', pre: text });
    }
  }

  function clearAll() {
    const n = state.ratings.length;
    ask({
      title: 'Börja en ny provning?',
      text: `Alla ${plural(n, 'omdöme', 'omdömen')}, i alla tre betygssystemen, raderas från den här enheten och går inte att få tillbaka. Dela gärna topplistan först.`,
      ok: 'Radera allt',
      danger: true,
      onOk: () => {
        state.ratings = [];
        expanded.clear();
        exitEdit();
        persist();
        resetForm();
        renderAll();
        showView('rate');
        toast('Alla omdömen raderade');
      }
    });
  }

  /* ---------- Vyer, meddelanden, dialog ---------- */
  function showView(v) {
    $('#view-rate').hidden = v !== 'rate';
    $('#view-board').hidden = v !== 'board';
    $('#tab-rate').setAttribute('aria-selected', String(v === 'rate'));
    $('#tab-board').setAttribute('aria-selected', String(v === 'board'));
    window.scrollTo(0, 0);
  }

  let toastTimer = null;
  function toast(msg, action) {
    const t = $('#toast'), b = $('#toastBtn');
    $('#toastMsg').textContent = msg;
    if (action) {
      b.hidden = false;
      b.textContent = action.label;
      b.onclick = () => { hideToast(); action.fn(); };
    } else {
      b.hidden = true;
      b.onclick = null;
    }
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 6000 : 2800);
  }
  function hideToast() { $('#toast').classList.remove('show'); }

  function ask({ title, text, ok, danger, onOk, pre }) {
    const d = $('#dlg');
    $('#dlgTitle').textContent = title;
    $('#dlgText').textContent = text;
    const p = $('#dlgPre');
    p.hidden = !pre;
    p.value = pre || '';
    const okBtn = $('#dlgOk');
    okBtn.hidden = !onOk;
    okBtn.textContent = ok || 'OK';
    okBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-go');
    $('#dlgCancel').textContent = onOk ? 'Avbryt' : 'Stäng';

    if (typeof d.showModal !== 'function') {           // Mycket gamla webbläsare
      if (pre) window.prompt(title, pre);
      else if (onOk && window.confirm(text)) onOk();
      return;
    }
    d.returnValue = '';
    d.onclose = () => { if (d.returnValue === 'ok' && onOk) onOk(); };
    d.showModal();
    if (pre) { p.focus(); p.select(); }
  }

  /* ---------- Snapsfakta ---------- */
  const factOrder = FACTS.map((_, i) => i);
  for (let i = factOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [factOrder[i], factOrder[j]] = [factOrder[j], factOrder[i]];
  }
  let factPos = 0;
  const showFact = () => { $('#factText').textContent = FACTS[factOrder[factPos % FACTS.length]]; };

  /* ---------- Händelser ---------- */
  function bind() {
    $('#form').addEventListener('submit', onSubmit);

    $('#modes').addEventListener('click', (e) => {
      const b = e.target.closest('[data-mode]');
      if (b) setMode(b.dataset.mode);
    });

    $('#scales').addEventListener('change', (e) => {
      if (e.target.type === 'radio') {
        setScore(e.target.name, Number(e.target.value), true);
        if (!document.querySelector('.crit.invalid') && !document.querySelector('.field.invalid')) hideError();
      }
    });
    $('#scales').addEventListener('click', (e) => {
      const s = e.target.closest('[data-step]');
      if (s) setHouseholds(Math.max(1, (state.households || 0) + Number(s.dataset.step)));
    });
    $('#scales').addEventListener('input', (e) => {
      if (e.target.id === 'households') {
        e.target.value = e.target.value.replace(/\D/g, '');
        setHouseholds(parseInt(e.target.value, 10) || 0, true);
      }
    });

    $('#name').addEventListener('input', () => { $('#field-name').classList.remove('invalid'); renderChips(); });
    $('#bottle').addEventListener('input', () => { $('#field-bottle').classList.remove('invalid'); renderChips(); });

    // Enter ska flytta vidare, inte skicka ett halvfärdigt formulär
    $('#name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#bottle').focus(); } });
    $('#bottle').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });

    $('#nameChips').addEventListener('click', (e) => {
      const c = e.target.closest('[data-name]');
      if (!c) return;
      $('#name').value = c.dataset.name;
      $('#field-name').classList.remove('invalid');
      renderChips();
    });
    $('#bottleChips').addEventListener('click', (e) => {
      const c = e.target.closest('[data-bottle]');
      if (!c) return;
      $('#bottle').value = c.dataset.bottle;
      $('#field-bottle').classList.remove('invalid');
      renderChips();
    });

    document.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', cancelEdit));
    document.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => showView(b.dataset.goto)));

    $('#podium').addEventListener('click', (e) => {
      const p = e.target.closest('[data-jump]');
      if (!p) return;
      expanded.add(p.dataset.jump);
      renderBoard();
      const entry = [...document.querySelectorAll('.entry')].find((el) => el.dataset.key === p.dataset.jump);
      if (entry) entry.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    });

    $('#board').addEventListener('click', (e) => {
      const t = e.target.closest('[data-toggle],[data-edit],[data-del]');
      if (!t) return;
      if (t.dataset.toggle !== undefined) {
        const k = t.dataset.toggle;
        const open = !expanded.has(k);
        open ? expanded.add(k) : expanded.delete(k);
        t.setAttribute('aria-expanded', String(open));
        document.getElementById(t.getAttribute('aria-controls')).hidden = !open;
      } else if (t.dataset.edit) {
        startEdit(t.dataset.edit);
      } else if (t.dataset.del) {
        deleteRating(t.dataset.del);
      }
    });

    $('#shareBtn').addEventListener('click', shareBoard);
    $('#clearBtn').addEventListener('click', clearAll);
    $('#nextFact').addEventListener('click', () => { factPos++; showFact(); });

    // Synka om appen är öppen i två flikar
    window.addEventListener('storage', (e) => {
      if (e.key === STORE_KEY) { load(); buildScales(); renderAll(); }
    });
  }

  /* ---------- Installera som app ---------- */
  const embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const install = (() => {
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    const DISMISS_KEY = 'beskapp.installDismissed';
    const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Dela"><path d="M12 3v12M8 7l4-4 4 4M6 11H5v10h14V11h-1"/></svg>';
    let deferred = null;

    const standalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const dismissed = () => { try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; } };
    const canOffer = () => !embedded && !standalone() && (deferred || isIOS || isAndroid);

    function render() {
      const offer = canOffer();
      $('#installCard').hidden = !offer || dismissed();
      $('#installLink').hidden = !offer || !dismissed();
      $('#installBtn').textContent = deferred ? 'Installera' : 'Visa hur';
    }

    function showSteps() {
      const steps = isIOS ? [
        `Tryck på Dela-knappen ${SHARE} i Safari. Ser du den inte, tryck först på <b>⋯</b> bredvid adressfältet.`,
        'Välj <b>Lägg till på hemskärmen</b>. Bläddra ned i listan om du inte ser det direkt.',
        'Tryck på <b>Lägg till</b>. Nu ligger Beskapp bland dina appar.'
      ] : [
        'Tryck på menyknappen <b>⋮</b> uppe till höger i webbläsaren.',
        'Välj <b>Installera app</b> eller <b>Lägg till på startskärmen</b>.',
        'Tryck på <b>Installera</b>. Nu ligger Beskapp bland dina appar.'
      ];
      $('#installTitle').textContent = isIOS ? 'Lägg till på hemskärmen' : 'Installera Beskapp';
      $('#installSteps').innerHTML = steps.map((t) => `<li><span>${t}</span></li>`).join('');
      const note = $('#installNote');
      note.hidden = !(isIOS && state.ratings.length);
      note.textContent = 'Appen på hemskärmen sparar sina omdömen för sig. De omdömen som redan finns här i Safari följer inte med.';
      const d = $('#installDlg');
      if (typeof d.showModal === 'function') d.showModal();
    }

    async function start() {
      if (!deferred) { showSteps(); return; }
      const prompt = deferred;
      deferred = null;
      prompt.prompt();
      try { await prompt.userChoice; } catch (e) { /* användaren stängde rutan */ }
      render();
    }

    function later() {
      try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) { /* sparas inte, kortet kommer tillbaka nästa gång */ }
      $('#installCard').hidden = true;
      render();
      toast('Du hittar knappen längst ned på sidan');
    }

    function init() {
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; render(); });
      window.addEventListener('appinstalled', () => { deferred = null; render(); toast('Beskapp är installerad'); });
      $('#installBtn').addEventListener('click', start);
      $('#installLink').addEventListener('click', start);
      $('#installLater').addEventListener('click', later);
      render();

      // Service worker: gör appen installerbar i Chrome och låter den starta utan internet
      if ('serviceWorker' in navigator && window.isSecureContext && !embedded) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
      }
    }
    return { init };
  })();

  /* ---------- Start ---------- */
  load();
  buildGarland();
  buildScales();
  resetForm();
  bind();
  showFact();
  renderAll();
  install.init();
})();
</script>
</body>
</html>
